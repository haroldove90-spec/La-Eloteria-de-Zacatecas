<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>La Elotería de Zacatecas</title>
    <meta name="theme-color" content="#155E37" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="La Elotería" />
    
    <!-- PWA Icons & Manifest Links -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="https://appdesignproyectos.com/laeloterialogo.png" />
    <link rel="apple-touch-icon" href="https://appdesignproyectos.com/laeloterialogo.png" />
    
    <style>
      /* Ensure full page height/flex matching and scroll behaviour */
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #FEF9E7;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('Service Worker registrado con éxito:', reg.scope))
            .catch((err) => console.error('Error al registrar Service Worker:', err));
        });
      }
    </script>
  </body>
</html>
